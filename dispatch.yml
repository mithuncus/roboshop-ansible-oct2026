- name: dispatch
  hosts: dispatch
  become: yes
  tasks: 
    - name: Install Go
      ansible.builtin.dnf: 
        name: golang
        state: present

    - name: create application user as roboshop
      ansible.builtin.user:
        name: roboshop

    - name: create directory for /app
      ansible.builtin.file: 
        path: /app
        state: directory 

    - name: downloading the dispatch app
      ansible.builtin.get_url: 
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/dispatch-v4.zip
        dest: /tmp
    
    - name: unarchive the dispatch-v4.zip file 
      ansible.builtin.unarchive: 
        src: /tmp/dispatch-v4.zip
        dest: /app
        remote_src: yes
    -------------------------------------------------------
    - name: change directory and run go build -o dispatch
      ansible.builtin.command: go build -o dispatch
      -----------------------------------------------------
    - name: copy dispatch service
      ansible.builtin.copy:
        src: dispatch.service
        dest: /etc/systemd/system/dispatch.service

    - name: dispatch service daemon reload enable and start 
      ansible.builtin.systemd_service:
        name: dispatch.service
        daemon_reload: true
        enabled: true
        state: started
        