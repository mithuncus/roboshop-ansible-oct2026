- name: install mongodb
  hosts: mongodb
  become: yes
  tasks:
  - name: copy mongodb repo
    ansible.builtin.copy:  # for copying repo's we use this 
      src: mongodb.repo
      dest: /etc/yum.repos.d/mongo.repo

  - name: install mongodb
    ansible.builtin.package: # for installing ansible packages
      name: mongodb-org
      state: present
  
  - name: start and enable mongod service 
    anisble.builtin.service:
      name: mongod
      state: started
      enabled: yes

  - name: allow remote connections
    ansible.builtin.replace: 
      path: /etc/mongod.conf
      regexp: '127.0.0.1'
      replace: '0.0.0.0'
  
  - name: restart after change
    anisble.builtin.service:
      name: mongod
      state: restarted







