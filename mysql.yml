- name: mysql
  hosts: mysql
  become: yes
  tasks: 
    - name: install mysql
      ansible.builtin.shell: dnf module enable mysql:8.4 -y ; dnf install mysql-server -y

    - name: start and enable the mysql service
      ansible.builtin.service:
        name: mysqld
        state: started
        enabled: yes 

