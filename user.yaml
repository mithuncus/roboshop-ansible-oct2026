- name: user
  hosts: user
  become: yes
  tasks: 
  - name: disabling lastest nodejs and enabling required nodejs version 24
    ansible.builtin.shell: dnf module disable nodejs -y ;dnf module enable nodejs:24 -y

  - name: install nodejs 
    ansible.builtin.dnf:
      name: nodejs
      state: present
  
  - name: create application user as roboshop
    ansible.builtin.user:
      name: roboshop

  - name: create directory /app
    ansible.builtin.file:
      path: /app
      state: directory 
  
  - name: donwloading url 
    ansible.builtin.get_url: 
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/user-v4.zip
      dest: /tmp

  - name: extract user application 
    ansible.builtin.unarchive:
      src: /tmp/user-v4.zip
      dest: /app
      remote_src: yes 

  - name: install dependences (run npm install command so we are using command is fast then shell)
    ansible.builtin.command: npm install
    args:
      chdir: /app

  - name: creating user service 
    ansible.builtin.copy: 
      src: user.service
      dest: /etc/systemd/system/user.service


  - name: system daemon reload 
    ansible.builtin.systemd_service:
      daemon_reload: true