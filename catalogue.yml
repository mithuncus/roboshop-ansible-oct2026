- name: catalogue
  hosts: catalogue
  become: yes
  tasks: 
  - name: disabling lastest nodejs and enabling required nodejs version 24
    ansible.builtin.shell: dnf module disable nodejs -y ;dnf module enable nodejs:24 -y

  - name: install nodejs 
    ansible.builtin.dnf:
      name: nodejs
      state: present
  
  - name: create application user as roboshop
    ansible.builtin.user:
      name: roboshop

  - name: create /app directory 
    ansible.builtin.file:
      path: /app
      state: directory 

  - name: download catalogue application 
    ansible.builtin.get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
      dest: /tmp
  
  - name: extract catalogue application 
    ansible.builtin.unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes 

